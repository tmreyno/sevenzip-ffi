name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Build Windows executables and library
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C library and examples
        run: cmake --build build --config Release -j4

      - name: Package Windows artifacts
        shell: bash
        run: |
          mkdir -p dist/windows/bin dist/windows/lib dist/windows/include
          # Copy DLL and import library (MSVC puts outputs in Release/ subdirectory)
          cp build/Release/7z_ffi.dll dist/windows/bin/ 2>/dev/null \
            || cp build/7z_ffi.dll dist/windows/bin/
          cp build/Release/7z_ffi.lib dist/windows/lib/ 2>/dev/null \
            || cp build/7z_ffi.lib dist/windows/lib/ 2>/dev/null || true
          # Copy example executables (optional, best-effort)
          cp build/examples/Release/*.exe dist/windows/bin/ 2>/dev/null \
            || cp build/examples/*.exe dist/windows/bin/ 2>/dev/null || true
          # Copy headers and docs
          cp include/7z_ffi.h dist/windows/include/
          cp README.md dist/windows/
          # Create zip archive
          cd dist
          7z a -tzip sevenzip-ffi-windows-${{ github.ref_name }}.zip windows/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sevenzip-ffi-windows-${{ github.ref_name }}
          path: dist/sevenzip-ffi-windows-${{ github.ref_name }}.zip

  # Build macOS binaries and library
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C library and examples
        run: cmake --build build --config Release -j4

      - name: Package macOS artifacts
        run: |
          mkdir -p dist/macos/bin dist/macos/lib dist/macos/include
          # Copy shared and static libraries
          cp build/lib7z_ffi.dylib dist/macos/lib/ 2>/dev/null || true
          cp build/lib7z_ffi.a dist/macos/lib/ 2>/dev/null || true
          # Copy example binaries (optional, best-effort)
          find build/examples -maxdepth 1 -type f -executable \
            -exec cp {} dist/macos/bin/ \; 2>/dev/null || true
          # Copy headers and docs
          cp include/7z_ffi.h dist/macos/include/
          cp README.md dist/macos/
          # Create zip archive
          cd dist
          zip -r sevenzip-ffi-macos-${{ github.ref_name }}.zip macos/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sevenzip-ffi-macos-${{ github.ref_name }}
          path: dist/sevenzip-ffi-macos-${{ github.ref_name }}.zip

  # Build Linux library (optional, for completeness)
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C library and examples
        run: cmake --build build --config Release -j4

      - name: Package Linux artifacts
        run: |
          mkdir -p dist/linux/bin dist/linux/lib dist/linux/include
          # Copy shared and static libraries
          cp build/lib7z_ffi.so dist/linux/lib/ 2>/dev/null || \
            cp build/lib7z_ffi.so.* dist/linux/lib/ 2>/dev/null || true
          cp build/lib7z_ffi.a dist/linux/lib/ 2>/dev/null || true
          # Copy example binaries (optional, best-effort)
          find build/examples -maxdepth 1 -type f -executable \
            -exec cp {} dist/linux/bin/ \; 2>/dev/null || true
          # Copy headers and docs
          cp include/7z_ffi.h dist/linux/include/
          cp README.md dist/linux/
          # Create tar.gz archive
          cd dist
          tar -czf sevenzip-ffi-linux-${{ github.ref_name }}.tar.gz linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: sevenzip-ffi-linux-${{ github.ref_name }}
          path: dist/sevenzip-ffi-linux-${{ github.ref_name }}.tar.gz

  # Create the GitHub Release with all platform artifacts
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: sevenzip-ffi-windows-${{ github.ref_name }}
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: sevenzip-ffi-macos-${{ github.ref_name }}
          path: dist/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: sevenzip-ffi-linux-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mark as prerelease if tag contains a semver prerelease identifier (e.g. v1.0.0-beta.1)
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "sevenzip-ffi ${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            dist/sevenzip-ffi-windows-${{ github.ref_name }}.zip \
            dist/sevenzip-ffi-macos-${{ github.ref_name }}.zip \
            dist/sevenzip-ffi-linux-${{ github.ref_name }}.tar.gz
